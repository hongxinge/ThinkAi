
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinkai-framework"
version = "0.8.0"
description = "Enterprise-grade AI framework for seamless LLM integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "ThinkAi Team", email = "thinkai@example.com"}
]
keywords = ["ai", "llm", "fastapi", "openai", "ollama", "rag", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
# Ollama / Qwen / Claude / Gemini 均通过 httpx 或 OpenAI 兼容层实现，
# 不依赖各家官方 SDK，故不再声明这些未经使用的依赖。
web = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
openai = ["openai>=1.0.0"]
deepseek = ["openai>=1.0.0"]
rag = [
    "chromadb>=0.4.0",
    "pypdf>=3.0",
]
session = ["redis>=4.2"]
image = ["Pillow>=9.0"]
agent = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "redis>=4.2",
    "build>=1.0",
    "twine>=4.0",
]
all = [
    "thinkai[web,openai,deepseek,rag,session,image,agent]",
]

[project.urls]
Homepage = "https://github.com/hongxinge/ThinkAi"
Documentation = "https://github.com/hongxinge/ThinkAi#readme"
Repository = "https://github.com/hongxinge/ThinkAi"
Issues = "https://github.com/hongxinge/ThinkAi/issues"

[project.scripts]
thinkai = "thinkai.cli:main"

[tool.setuptools.packages.find]
include = ["thinkai*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
